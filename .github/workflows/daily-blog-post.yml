# Günlük içerik hattı — miamigezi
#
# Neden Vercel Cron değil GitHub Action? Yayın hedefi git'e commit edilen statik
# bir dosya (src/content/blog/generated-posts.json — sayfalar SSG ile üretiliyor,
# AI crawler'ların JS çalıştırmadan gördüğü şey bu). Vercel fonksiyonlarının dosya
# sistemi salt-okunur olduğu için bir cron route'u repoya ancak GitHub API +
# kalıcı PAT ile yazabilirdi; GH Actions ise yerleşik, kapsamı sınırlı
# GITHUB_TOKEN ile doğrudan push edebiliyor ve cron'u da kendisi sağlıyor.
# Ayrıntılı işletim rehberi: docs/blog-pipeline.md
#
# Manuel tetikleme: Actions sekmesi → "Günlük blog yazısı" → Run workflow
# (dry_run=true seçilirse hiçbir dosya yazılmaz/push edilmez — API yine çağrılır).

name: Günlük blog yazısı

on:
  schedule:
    # 06:30 UTC = 09:30 İstanbul, 02:30 Miami — düşük trafik penceresi
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (dosya yazma / push yok)'
        type: boolean
        default: false
      mock:
        description: 'Mock taslak (API çağırma — sadece hattı test eder)'
        type: boolean
        default: false

concurrency:
  group: daily-blog-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # schedule → default branch (main); workflow_dispatch → seçilen ref.
      # Sabit 'ref: main' YAZMA: branch üzerinde dry-run testini imkânsız kılar
      # (miamili'de ilk canlı testte branch dispatch'i main'in eski kodunu çalıştırdı).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      # Kalite kapısının BİRİM TESTİ — API'siz, saniyeler sürer. Kapı bozulmuşsa
      # (mutasyon kaçıyorsa ya da meşru yazımı yanlışlıkla eliyorsa) job burada
      # kırmızıya döner ve API'ye tek bir istek bile gitmez.
      - name: Kalite kapısı self-test
        run: npm run blog:test

      # Krem/bej koruma kapısı — API'siz. Hat her gün main üzerinde koştuğu için
      # aynı zamanda günlük kanarya: palete sızmış bir sıcak nötr en geç ertesi
      # sabah kırmızıya döner (bkz. CLAUDE.md → Tasarım sistemi).
      - name: Krem/bej kapısı
        run: npm run check:renk

      # Görsel manifesti kapısı — API'siz. İki şeyi denetler: (a) her rehberin
      # bir görsel hedefi var mı, (b) manifestteki her kaydın Türkçe alt metni
      # dolu mu (alt'sız görsel ekran okuyucuda sessizdir). Hattın eklediği YENİ
      # yazının görseli henüz yoktur — bu UYARI'dır, kırmızı DEĞİL: yazı
      # görselsiz de sorunsuz yayınlanır, log'da "eksik hedef" satırı görünür.
      - name: Görsel manifesti kapısı
        run: npm run images:check

      - name: Yazıyı üret
        id: generate
        continue-on-error: true # needs_review durumunda da state commit edilsin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "${{ inputs.mock }}" = "true" ]; then FLAGS="$FLAGS --mock"; fi
          node scripts/generate-blog-post.mjs $FLAGS

      # Yayın VEYA needs_review state değişikliklerini commit et.
      # Push → Vercel main deploy'unu otomatik tetikler → sitemap.xml yeni
      # makaleyi içerir (sitemap.ts ALL_POSTS üzerinden üretiyor).
      - name: Commit ve push
        id: push
        if: inputs.dry_run != true
        run: |
          git config user.name "miamigezi-bot"
          git config user.email "adanirmetin@gmail.com"
          git add src/content/blog/generated-posts.json content/
          if git diff --cached --quiet; then
            echo "değişiklik yok, commit atlanıyor"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "content(blog): günlük yazı ($(date -u +%F))"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # IndexNow: yeni URL'i Bing/Yandex'e bildirir.
      #
      # Anahtar artık burada SABİT DEĞİL. `scripts/indexnow.mjs` onu yayımlanan
      # `public/<key>.txt` dosyasından okur — çünkü IndexNow, `key` alanı ile
      # `keyLocation` içeriğinin BİREBİR aynı olmasını şart koşuyor. Anahtarın
      # ikinci bir kopyasını burada tutmak, ikisinin ayrıştığı güne kadar
      # sessizce çalışan bir kurulum demekti.
      #
      # Sabit `sleep 180` yerine `--wait-for-key`: anahtar dosyası gerçekten
      # yayına girene kadar bekler, girmezse ping ATMAZ. Yayında olmayan bir
      # anahtarla atılan ping 403 döner, yani boşa gider.
      #
      # Hata deploy'u KIRMAZ: script `--strict` olmadan her zaman 0 döner.
      - name: IndexNow bildirimi
        if: steps.generate.outputs.published == 'true' && steps.push.outputs.pushed == 'true'
        continue-on-error: true
        run: |
          node scripts/indexnow.mjs \
            "${{ steps.generate.outputs.post_url }}" \
            "https://miamigezi.com/blog" \
            --wait-for-key

      # Kalite kapısı 2 kez başarısız olduysa (needs_review) ya da kuyrukta
      # yayımlanabilir konu kalmadıysa job'u kırmızıya boya → GitHub e-posta
      # bildirimi. Ayrıntı iş özetinde (Summary) ve content/rejected-drafts/.
      #
      # NEDEN 'kuyruk boş' DA BURADA: 2026-09-13'te kuyruk tükendi, üretici
      # sessizce 0 döndü ve iş yeşil kaldı — site bir ay fark edilmeden durdu.
      - name: İnceleme gerekiyorsa kırmızıya boya
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::Yazı kalite kapısından 2 kez döndü, üretim hatası oluştu veya kuyrukta yayımlanabilir konu yok. Yukarıdaki iş özetini (Summary) ve content/rejected-drafts/ klasörünü incele."
          exit 1
